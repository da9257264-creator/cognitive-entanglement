<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadows for Light Theme -->
    <filter id="shadow-node" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#cbd5e1" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Linear Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#0f172a" font-size="24" font-weight="800" letter-spacing="2" text-anchor="middle">COGNITIVE ENTANGLEMENT FLIGHT ARCHITECTURE</text>
  <text x="500" y="70" fill="#64748b" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">AEROSPATIAL MULTI-MODAL DISTRIBUTED FLIGHT CONTROL PIPELINE</text>

  <!-- Layer 1: Inputs -->
  <g transform="translate(100, 100)" filter="url(#shadow-node)">
    <rect width="800" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="400" y="32" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">OUTER-LOOP: MULTI-CHANNEL SENSORY INPUTS</text>
    <text x="400" y="55" fill="#2563eb" font-size="12" font-weight="bold" text-anchor="middle">📱 PHONE B: WEB-CAM VIDEO &amp; LOW-LATENCY AUDIO CALL FEEDS (60Hz)</text>
    <rect x="20" y="42" width="100" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
    <text x="70" y="55" fill="#1e40af" font-size="9" font-weight="bold" text-anchor="middle">HMI CLIENT</text>
  </g>

  <!-- Flow Lines (Layer 1 to Layer 2) with Data Rates -->
  <path d="M 230,180 L 230,250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 500,180 L 500,250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 770,180 L 770,250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  
  <text x="180" y="215" fill="#64748b" font-size="9" font-weight="bold">60Hz Video Stream</text>
  <text x="450" y="215" fill="#64748b" font-size="9" font-weight="bold">WebRTC P2P Call</text>
  <text x="720" y="215" fill="#64748b" font-size="9" font-weight="bold">Vocal Audio Packets</text>

  <polygon points="230,255 226,245 234,245" fill="#94a3b8" />
  <polygon points="500,255 496,245 504,245" fill="#94a3b8" />
  <polygon points="770,255 766,245 774,245" fill="#94a3b8" />

  <!-- Layer 2: Feature Detectors -->
  <!-- Left Box: FaceMesh -->
  <g transform="translate(100, 260)" filter="url(#shadow-node)">
    <rect width="260" height="90" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="130" y="32" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">MediaPipe FaceMesh</text>
    <text x="130" y="52" fill="#64748b" font-size="10" text-anchor="middle">Face Ratios &amp; EAR Blinks</text>
    <text x="130" y="70" fill="#0284c7" font-size="10" font-weight="bold" text-anchor="middle">TypeScript / JS (60Hz)</text>
    <!-- Badge -->
    <rect x="180" y="10" width="70" height="15" rx="4" fill="#e0f2fe" />
    <text x="215" y="21" fill="#0369a1" font-size="8" font-weight="bold" text-anchor="middle">👁️ EYE-MORSE</text>
  </g>

  <!-- Center Box: Hands -->
  <g transform="translate(370, 260)" filter="url(#shadow-node)">
    <rect width="260" height="90" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="32" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">MediaPipe Hands</text>
    <text x="130" y="52" fill="#64748b" font-size="10" text-anchor="middle">ASL Mute Signs &amp; Crossed Wrists</text>
    <text x="130" y="70" fill="#2563eb" font-size="10" font-weight="bold" text-anchor="middle">TypeScript / JS (60Hz)</text>
    <!-- Badge -->
    <rect x="180" y="10" width="70" height="15" rx="4" fill="#dbeafe" />
    <text x="215" y="21" fill="#1e40af" font-size="8" font-weight="bold" text-anchor="middle">🤟 ASL SIGNS</text>
  </g>

  <!-- Right Box: Vocal -->
  <g transform="translate(640, 260)" filter="url(#shadow-node)">
    <rect width="260" height="90" rx="10" fill="#f8fafc" stroke="#9333ea" stroke-width="2"/>
    <text x="130" y="32" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Vocal Command Core</text>
    <text x="130" y="52" fill="#64748b" font-size="10" text-anchor="middle">Multi-Lingual Audio Stream</text>
    <text x="130" y="70" fill="#9333ea" font-size="10" font-weight="bold" text-anchor="middle">SpeechRecognition / gTTS</text>
    <!-- Badge -->
    <rect x="180" y="10" width="70" height="15" rx="4" fill="#f3e8ff" />
    <text x="215" y="21" fill="#6b21a8" font-size="8" font-weight="bold" text-anchor="middle">🗣️ VOICE KEY</text>
  </g>

  <!-- Flow Lines (Layer 2 to Layer 3) -->
  <path d="M 230,350 L 230,385 L 485,385 L 485,415" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 500,350 L 500,415" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 770,350 L 770,385 L 515,385 L 515,415" fill="none" stroke="#94a3b8" stroke-width="2" />
  
  <text x="510" y="375" fill="#64748b" font-size="9" font-weight="bold">Sub-ms Go Handshakes</text>
  <polygon points="500,420 496,410 504,410" fill="#94a3b8" />

  <!-- Layer 3: Central Fusion -->
  <g transform="translate(100, 425)" filter="url(#shadow-node)">
    <rect width="800" height="120" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/>
    <text x="400" y="32" fill="#0f172a" font-size="15" font-weight="900" letter-spacing="1" text-anchor="middle">MID-LOOP COGNITIVE DECISION FUSION ENGINE</text>
    <text x="400" y="55" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">🛸 PHONE A (ONBOARD DRONE BRAIN) • PYTHON &amp; GO (50Hz - 100Hz)</text>
    <text x="400" y="80" fill="#475569" font-size="10" text-anchor="middle">Dual-Factor Biometrics (Facial + Voice) | Setup Calibration Wizard | Predictive Crash Avoidance</text>
    <!-- Failsafe Badge -->
    <rect x="30" y="85" width="180" height="20" rx="4" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
    <text x="120" y="98" fill="#15803d" font-size="8" font-weight="bold" text-anchor="middle">🛡️ LOS CONNECTION FAILSAFE (1.5s)</text>
  </g>

  <!-- Flow Lines (Layer 3 to Layer 4) -->
  <path d="M 300,545 L 300,600" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 700,545 L 700,600" fill="none" stroke="#94a3b8" stroke-width="2" />
  <polygon points="300,605 296,595 304,595" fill="#94a3b8" />
  <polygon points="700,605 695,595 705,595" fill="#94a3b8" />

  <!-- Layer 4: Obstacles and Swarm -->
  <!-- Left: 3D Avoidance -->
  <g transform="translate(100, 610)" filter="url(#shadow-node)">
    <rect width="380" height="100" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="190" y="30" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">3D Blockade Sensing &amp; Path Recovery</text>
    <text x="190" y="50" fill="#64748b" font-size="9" text-anchor="middle">Auto-Scales vertical velocities over Front/Up/Down blockades</text>
    <text x="190" y="70" fill="#0284c7" font-size="10" font-weight="bold" text-anchor="middle">Bypass Trajectory Memory &amp; Speed Recovery</text>
    <rect x="20" y="78" width="160" height="15" rx="3" fill="#e0f2fe" />
    <text x="100" y="88" fill="#0369a1" font-size="8" font-weight="bold" text-anchor="middle">🛡️ TIME-TO-COLLISION BRAKES</text>
  </g>

  <!-- Right: Swarm Flocking -->
  <g transform="translate(520, 610)" filter="url(#shadow-node)">
    <rect width="380" height="100" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="30" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Swarm Flocking &amp; Formation Shifter</text>
    <text x="190" y="50" fill="#64748b" font-size="9" text-anchor="middle">Calculates dynamic offsets relative to Leader trajectories</text>
    <text x="190" y="70" fill="#2563eb" font-size="10" font-weight="bold" text-anchor="middle">Formations: V-SHAPE, LINE, ORBIT HELIX</text>
    <rect x="20" y="78" width="140" height="15" rx="3" fill="#dbeafe" />
    <text x="90" y="88" fill="#1e40af" font-size="8" font-weight="bold" text-anchor="middle">🐝 FLOCKING ALGORITHMS</text>
  </g>

  <!-- Flow Lines (Layer 4 to Layer 5) -->
  <path d="M 290,710 L 290,750 L 485,750 L 485,775" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 710,710 L 710,750 L 515,750 L 515,775" fill="none" stroke="#94a3b8" stroke-width="2" />
  
  <text x="515" y="745" fill="#64748b" font-size="9" font-weight="bold">921,600 bps UART MAVLink</text>
  <polygon points="500,780 496,770 504,770" fill="#94a3b8" />

  <!-- Layer 5: Hardware Layer -->
  <g transform="translate(100, 785)" filter="url(#shadow-node)">
    <rect width="800" height="115" rx="12" fill="#f8fafc" stroke="#7e22ce" stroke-width="2"/>
    <text x="400" y="30" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">INNER-LOOP: UNIFIED HARDWARE &amp; SIMULATION APIS</text>
    <text x="400" y="52" fill="#7e22ce" font-size="11" font-weight="bold" text-anchor="middle">C++ Autopilot EKF3 / PID Rate Loops (1000Hz) | Verilog FPGA IMU registers | Three.js 3D Twin</text>
    <text x="400" y="72" fill="#64748b" font-size="10" text-anchor="middle">Physical Drone Targets: DJI Tello SDK, PX4/MAVLink, or Custom DIY Quadcopters</text>
    
    <!-- Failsafe Badges -->
    <rect x="150" y="85" width="180" height="20" rx="4" fill="#faf5ff" stroke="#f3e8ff" stroke-width="1"/>
    <text x="240" y="98" fill="#6b21a8" font-size="8" font-weight="bold" text-anchor="middle">🛡️ DO-178C LEVEL A SAFETY CLAMP</text>
    
    <rect x="470" y="85" width="180" height="20" rx="4" fill="#faf5ff" stroke="#f3e8ff" stroke-width="1"/>
    <text x="560" y="98" fill="#6b21a8" font-size="8" font-weight="bold" text-anchor="middle">🛡️ 15% LOW-BATTERY AUTO-RTL</text>
  </g>
</svg>
